name: Build .NET
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/FC/FC.csproj
      - name: Build
        run: dotnet build src/FC/FC.csproj --no-restore -c Release
      - name: Logic smoke tests
        run: dotnet run --project tests/FC.LogicSmoke/FC.LogicSmoke.csproj -c Release

  docker:
    name: Comprobar imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build --pull --tag fc:ci .
